name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_PORT: "8000"
      RESULTS_FILE: tests/results/integration-results.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint Python with ruff
        run: ruff check app tests

      - name: Scan repository with Trivy (FS)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build Docker image
        run: docker build -t statuspulse-app:${{ github.sha }} -f Dockerfile .

      - name: Scan built image with Trivy (Image)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: statuspulse-app:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Start full stack
        # Note: We tag the image so docker-compose uses the one we just built/scanned
        run: |
          docker tag statuspulse-app:${{ github.sha }} statuspulse-app:local
          APP_IMAGE=statuspulse-app:local docker compose up -d db redis app

      - name: Wait for healthy API
        shell: bash
        run: |
          echo "Waiting for API to respond..."
          for i in $(seq 1 20); do
            # -v shows headers, helpful for debugging 'Connection Reset'
            if curl -fsv http://localhost:8000/health > /dev/null 2>&1; then
              STATUS=$(curl -fsS http://localhost:8000/health || echo "{}")
              if echo "$STATUS" | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
              checks = data.get("checks", {})
              healthy = data.get("status") == "healthy" and all(checks.get(k) == "healthy" for k in ("api","database","redis"))
              sys.exit(0 if healthy else 1)
          except Exception:
              sys.exit(1)
          '; then
                echo "✅ API is healthy"
                exit 0
              fi
            fi
            echo "Attempt $i: API not ready or connection reset. Retrying in 3s..."
            sleep 3
          done
          
          echo "❌ ERROR: API did not become healthy in time."
          echo "--- Dumping App Logs ---"
          docker compose logs app
          echo "--- Dumping Database Logs ---"
          docker compose logs db
          exit 1

      - name: Create results directory
        run: mkdir -p tests/results

      - name: Run integration tests
        run: bash tests/test_integration.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/results/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v