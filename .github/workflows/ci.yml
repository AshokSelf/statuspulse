name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      APP_PORT: "8000"
      RESULTS_FILE: tests/results/integration-results.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint Python with Ruff
        shell: bash
        run: |
          ruff check app tests

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Scan Dockerfile with Hadolint
        shell: bash
        run: |
          docker run --rm -i hadolint/hadolint:latest-debian < Dockerfile

      - name: Build Docker image
        shell: bash
        run: |
          docker build \
            -t statuspulse-app:${{ github.sha }} \
            -f Dockerfile .

      - name: Scan built image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: statuspulse-app:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Start full stack
        shell: bash
        run: |
          docker compose up -d --build app db redis

      - name: Wait for healthy API
        shell: bash
        run: |
          for i in $(seq 1 30); do

            STATUS=$(curl -fsS http://localhost:8000/health || true)

            echo "$STATUS" | python3 -c "
import json
import sys

data = json.load(sys.stdin)
checks = data.get('checks', {})

healthy = (
    data.get('status') == 'healthy'
    and all(
        checks.get(k) == 'healthy'
        for k in ('api', 'database', 'redis')
    )
)

raise SystemExit(0 if healthy else 1)
"

            if [ $? -eq 0 ]; then
              echo 'API is healthy'
              exit 0
            fi

            sleep 2
          done

          echo 'API did not become healthy in time'
          exit 1

      - name: Create results directory
        shell: bash
        run: |
          mkdir -p tests/results

      - name: Run integration tests
        shell: bash
        run: |
          bash tests/test_integration.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/results/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        shell: bash
        run: |
          docker compose down -v