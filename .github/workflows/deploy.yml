name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # --- Hardcoded AWS Configuration ---
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::381492115031:role/Statuplus
  INSTANCE_NAME: statuspulse
  PUBLIC_BASE_URL: https://ak-info.online

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    
    # REQUIRED PERMISSIONS FOR GHCR AND AWS OIDC
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
        shell: bash

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find EC2 instance
        id: instance
        run: |
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.INSTANCE_NAME }}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Error: No running instance found with name ${{ env.INSTANCE_NAME }}"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Send deploy command via SSM
        id: ssm
        run: |
          COMMAND_PAYLOAD=$(python3 - <<'PY'
          import json, os
          # Use GITHUB_SHA provided by the runner environment
          current_sha = os.environ.get('GITHUB_SHA')
          cmds = [
              "set -euo pipefail",
              "cd /opt/statuspulse",
              "git fetch --all --prune",
              f"git checkout {current_sha}",
              (
                  f"IMAGE_NAME={os.environ['IMAGE_NAME']} "
                  f"IMAGE_TAG={current_sha} "
                  f"PUBLIC_BASE_URL={os.environ['PUBLIC_BASE_URL']} "
                  "./scripts/deploy.sh"
              )
          ]
          print(json.dumps({"commands": cmds}))
          PY
          )
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --parameters "$COMMAND_PAYLOAD" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Deployment Completion
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ steps.instance.outputs.instance_id }}" \
              --query 'Status' --output text 2>/dev/null || true)
            echo "Current Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment Successful"
              exit 0
            elif [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              echo "Deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM"
          exit 1