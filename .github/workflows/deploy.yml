name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "381492115031"
  AWS_ROLE_ARN: arn:aws:iam::381492115031:role/statuspulse-github-actions
  INSTANCE_NAME: statuspulse
  HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  DOMAIN: ak-info.online
  PUBLIC_BASE_URL: https://ak-info.online
  CADDY_EMAIL: admin@ak-info.online
  DEPLOY_NOTIFY_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK_URL }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Resolve deploy metadata
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.HEAD_SHA }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find EC2 instance
        id: instance
        shell: bash
        run: |
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${INSTANCE_NAME}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Unable to find a running instance named ${INSTANCE_NAME}" >&2
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM agent
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            STATUS="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.instance.outputs.instance_id }}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"

            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi

            sleep 10
          done

          echo "SSM agent did not come online in time" >&2
          exit 1

      - name: Send deploy command
        id: ssm
        shell: bash
        run: |
          COMMAND_PAYLOAD="$(python3 - <<'PY'
          import json
          import os
          import shlex

          aws_account_id = os.environ["AWS_ACCOUNT_ID"]
          aws_region = os.environ["AWS_REGION"]
          caddy_email = os.environ["CADDY_EMAIL"]
          domain = os.environ["DOMAIN"]
          head_sha = os.environ["HEAD_SHA"]
          image_name = os.environ["IMAGE_NAME"]
          instance_name = os.environ["INSTANCE_NAME"]
          public_base_url = os.environ["PUBLIC_BASE_URL"]
          repository_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}.git"

          def q(value):
              return shlex.quote(value)

          commands = [
              "set -euo pipefail",
              "export HOME=\"${HOME:-/root}\"",
              "if command -v dnf >/dev/null 2>&1; then dnf install -y docker git openssl python3 cronie; fi",
              "if ! command -v curl >/dev/null 2>&1 && command -v dnf >/dev/null 2>&1; then dnf install -y curl-minimal || dnf install -y --allowerasing curl; fi",
              "systemctl enable --now docker || true",
              "systemctl enable --now amazon-ssm-agent || true",
              "systemctl enable --now crond || true",
              "mkdir -p /opt /var/log/statuspulse",
              "if [ ! -d /opt/statuspulse/.git ]; then "
              "if [ -d /opt/statuspulse ] && [ -z \"$(find /opt/statuspulse -mindepth 1 -maxdepth 1 ! -name backups ! -name logs ! -name .env 2>/dev/null | head -n 1)\" ]; then "
              "tmp_dir=\"$(mktemp -d /tmp/statuspulse-checkout.XXXXXX)\"; "
              f"git clone --branch main --single-branch {q(repository_url)} \"$tmp_dir\"; "
              "cp -a \"$tmp_dir\"/. /opt/statuspulse/; "
              "rm -rf \"$tmp_dir\"; "
              "elif [ ! -e /opt/statuspulse ]; then "
              f"git clone --branch main --single-branch {q(repository_url)} /opt/statuspulse; "
              "else "
              "echo '/opt/statuspulse exists but is not a git checkout' >&2; "
              "exit 1; "
              "fi; "
              "fi",
              "cd /opt/statuspulse",
              "git config --global --add safe.directory /opt/statuspulse || true",
              "git config --global advice.detachedHead false || true",
              f"git remote set-url origin {q(repository_url)}",
              "git fetch --all --prune",
              f"git -c advice.detachedHead=false checkout --force {q(head_sha)}",
              "chmod +x ./scripts/*.sh || true",
              "bash ./scripts/install-compose-plugin.sh",
              f"IMAGE_NAME={q(image_name)} PUBLIC_BASE_URL={q(public_base_url)} DOMAIN={q(domain)} CADDY_EMAIL={q(caddy_email)} AWS_REGION={q(aws_region)} AWS_ACCOUNT_ID={q(aws_account_id)} AWS_INSTANCE_NAME={q(instance_name)} bash ./scripts/bootstrap-prod-env.sh",
              "chown -R ec2-user:ec2-user /opt/statuspulse || true",
              f"IMAGE_NAME={q(image_name)} IMAGE_TAG={q(head_sha)} PUBLIC_BASE_URL={q(public_base_url)} bash ./scripts/deploy.sh",
          ]

          print(json.dumps({"commands": commands}))
          PY
          )"

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --comment "StatusPulse deploy ${HEAD_SHA}" \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --parameters "$COMMAND_PAYLOAD" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy command
        shell: bash
        run: |
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ steps.instance.outputs.instance_id }}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.ssm.outputs.command_id }}" \
                  --instance-id "${{ steps.instance.outputs.instance_id }}" \
                  --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for deployment to finish" >&2
          exit 1

      - name: Verify health
        shell: bash
        run: |
          HOST="${PUBLIC_BASE_URL#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"

          if ! getent hosts "$HOST" >/dev/null; then
            echo "DNS lookup failed for $HOST. Point the domain to the Terraform Elastic IP before public verification can pass." >&2
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT

          for _ in $(seq 1 12); do
            if curl -fsS --max-time 20 -o "$BODY_FILE" "${PUBLIC_BASE_URL}/health" && python3 - "$BODY_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              data = json.load(fh)

          checks = data.get("checks", {})
          healthy = data.get("status") == "healthy" and all(checks.get(k) == "healthy" for k in ("api", "database", "redis"))
          raise SystemExit(0 if healthy else 1)
          PY
            then
              exit 0
            fi

            sleep 10
          done

          echo "Public health verification failed for ${PUBLIC_BASE_URL}/health" >&2
          exit 1

      - name: Notify success
        if: success() && env.DEPLOY_NOTIFY_WEBHOOK_URL != ''
        shell: bash
        run: |
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"text\":\"StatusPulse deploy succeeded for ${HEAD_SHA}\"}" \
            "$DEPLOY_NOTIFY_WEBHOOK_URL"

      - name: Notify failure
        if: failure() && env.DEPLOY_NOTIFY_WEBHOOK_URL != ''
        shell: bash
        run: |
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"text\":\"StatusPulse deploy failed for ${HEAD_SHA}\"}" \
            "$DEPLOY_NOTIFY_WEBHOOK_URL"
